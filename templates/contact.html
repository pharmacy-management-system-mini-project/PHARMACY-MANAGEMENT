<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - MedCare Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .contact-container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--glass-bg);
            padding: 50px;
            border-radius: 35px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
        }
        .contact-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .contact-header h1 {
            font-size: 38px;
            color: var(--primary-dark);
            font-weight: 800;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }
        .contact-card {
            background: rgba(255,255,255,0.6);
            padding: 30px 20px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }
        .contact-card:hover { transform: translateY(-8px); background: white; }
        .contact-card i {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .contact-card h4 { color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .contact-card p { color: var(--text-light); font-size: 14px; }

        .btn-back-aesthetic {
            background: white;
            border: 1px solid var(--glass-border);
            padding: 8px 15px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-back-aesthetic:hover {
            background: var(--primary);
            color: white;
            transform: translateX(-3px);
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="dashboard-wrapper">
        {% set active_page = 'contact' %}
        {% include '_sidebar.html' %}

        <main class="main-content" id="main-content">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button class="sidebar-toggle" id="toggle-sidebar">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </button>
                </div>
                <div class="header-title" style="margin-left: 20px;">
                    <h1>Contact</h1>
                </div>
            </header>

            <div class="contact-container">

                <div class="contact-grid">
                    <div class="contact-card">
                        <i class="fa-solid fa-envelope-open-text"></i>
                        <h4>Email Support</h4>
                        <p>support@medcarepro.com</p>
                    </div>
                    <div class="contact-card">
                        <i class="fa-solid fa-headset"></i>
                        <h4>Phone</h4>
                        <p>+1 (555) 123-4567</p>
                    </div>
                    <div class="contact-card">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <h4>Our Office</h4>
                        <p>123 Healthcare Plaza, Tech City</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggle-sidebar');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        });
    </script>
</body>
</html>
